##### PREFIX #####
set-option -g prefix C-p
unbind C-b
bind-key C-b send-prefix

##### GENERAL #####
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set-window-option -g mode-keys vi
set -g extended-keys on

##### COLORS #####
# Palette:
# Background:       #171719
# Secondary:        #252528
# Inactive gray:    #77777D
# Foreground:       #E6E3E3
# Pale red:         #E8A0A0
# Soft red:         #C98282

##### PANE BORDERS #####
set -g pane-border-lines single
set -g pane-border-style 'fg=#444449'
set -g pane-active-border-style 'fg=#E8A0A0'

##### STATUS BAR #####
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify centre
set -g status-style 'bg=#171719,fg=#E6E3E3'
set -g status-left-length 50

# Session indicator
set -g status-left '#[fg=#171719,bg=#E8A0A0,bold]  #S  #[fg=#E8A0A0,bg=#252528] '

# Window tabs
set -g window-status-separator ''
set -g window-status-style 'fg=#85858B,bg=#252528'
set -g window-status-format '  #W #I#{?window_zoomed_flag,Z,}  '

# Active window
set -g window-status-current-style 'fg=#171719,bg=#E8A0A0,bold'
set -g window-status-current-format '  #W #I#{?window_zoomed_flag,Z,}  '

# Right side: date and time
set -g status-right '#[fg=#E8A0A0,bold]#{?window_zoomed_flag,Z ,}#[fg=#E6E3E3,bold]#{user}@#H '
set -g status-right-length 60


##### MESSAGE STYLING #####
set -g message-style 'bg=#E8A0A0,fg=#171719,bold'
set -g message-command-style 'bg=#252528,fg=#E6E3E3'

##### COPY MODE #####
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

##### SPLITS & WINDOWS #####
# Keep current working directory
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key '"' split-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

##### RELOAD CONFIG #####
bind-key r source-file ~/.tmux.conf \; display-message "tmux config reloaded!"

##### PLUGINS #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jimeh/tmuxifier'

# Resurrect & Continuum
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# TPM - keep at the bottom
run '~/.tmux/plugins/tpm/tpm'

# Better copypaste? 
set -g set-clipboard on

# Useful terminal behavior
set -g history-limit 50000

# Notifies applications when a pane gains or loses focus.
# Useful for Neovim, terminal applications, and focus-aware plugins.
# Allows applications to update cursor behavior or other UI elements.
set -g focus-events on

# Prevents applications from changing the tmux window name through terminal escape sequences.
set -g allow-rename off
set -g automatic-rename off

# Show command above each pane
set -g pane-border-status top
set -g pane-border-format ' #[fg=#E8A0A0,bold]#P #[fg=#E6E3E3]#{pane_current_command} '

bind e setw synchronize-panes
